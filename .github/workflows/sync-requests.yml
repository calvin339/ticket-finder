name: Sync artist requests

# Copies the Google Sheet of visitor artist requests into requests.csv every hour,
# so the web check (3 times a day) can read it from the repository.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-requests
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download requests
        run: |
          url=$(python3 -c "import json; print(json.load(open('watchlist.json')).get('requestsCsv') or '')")
          if [ -z "$url" ]; then echo "No requestsCsv set"; exit 0; fi
          curl -fsSL "$url" -o requests.csv.new
          mv requests.csv.new requests.csv

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain requests.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add requests.csv
            git commit -m "Sync requests"
            git pull --rebase -q origin main && git push
          else
            echo "No changes"
          fi
